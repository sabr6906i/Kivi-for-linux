name: Real Wayland compositor preview checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compositor:
    name: ${{ matrix.desktop }} Wayland compositor
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        desktop: [GNOME, KDE]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install isolated compositor test dependencies
        env:
          TEST_DESKTOP: ${{ matrix.desktop }}
        run: |
          scripts/ci-ubuntu-mirrors.sh
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 python3-tk dbus-x11 wayland-utils libgl1-mesa-dri libglx-mesa0 xvfb
          if [ "$TEST_DESKTOP" = GNOME ]; then
            sudo apt-get install -y gnome-shell
          else
            sudo apt-get install -y kwin-wayland
          fi
      - name: Run real isolated Wayland compositor and GTK smoke
        env:
          TEST_DESKTOP: ${{ matrix.desktop }}
        run: scripts/smoke-wayland-session.sh "$TEST_DESKTOP" dist/desktop-preview
        timeout-minutes: 5
      - name: Preserve compositor diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wayland-preview-${{ matrix.desktop }}
          path: dist/desktop-preview/
          if-no-files-found: warn
